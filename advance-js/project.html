<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Periodic Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Bricolage Grotesque";
      }
      html {
        font-size: 62.5%;
      }
      body {
        height: 100vh;
        width: 100%;
        background-color: black;
        color: aliceblue;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-size: 3.5rem;
        margin: 5rem 0;
      }

      #table {
        width: 90%;
        display: grid;
        grid-template-columns: repeat(10, minmax(100px,1fr));
        gap: 1rem;
      }

      .element {
        color: salmon;
        font-size: 1.8rem;
        border-radius: 1rem;
        place-self: center;
     width: 100px;
     aspect-ratio: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 0.1rem solid salmon;
        transition: all 0.3s linear;
        cursor: pointer;
        &:hover {
          background-color: salmon;
          color: black;
        }
      }
      @media (width<=1400px) {
        #table {
          grid-template-columns: repeat(auto-fit, minmax(100px,1fr));
        }
      }
    </style>
  </head>
  <body>
    <h1>Event Delegation - Periodic Table</h1>
    <section id="table"></section>
    <script>
      const elementSection = document.getElementById("table");

      const createElement = (symbol, atomicNumber, name) => {
        const element = document.createElement("div");
        element.classList.add("element");
        element.innerText = symbol;
        element.setAttribute("data-atomic-number", atomicNumber);
        element.setAttribute("data-name", name);
        return element;
      };

      const initializeTable = () => {
        for (let i = 0; i < 50; i++) {
          const element = createElement(
            `Elem ${i + 1}`,
            i + 1,
            `Element ${i + 1}`
          );
          elementSection.append(element);
        }
      };

      const handleClickEvent = (event) => {
        const target = event.target;
        if (target.classList.contains("element")) {
          const atomicNumber = target.getAttribute("data-atomic-number");
          const name = target.getAttribute("data-name");
          alert(`Atomic Number: ${atomicNumber}\nName: ${name}`);
        }
      };

      elementSection.addEventListener("click", handleClickEvent);
      initializeTable();
    </script>
  </body>
</html>
